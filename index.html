<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Grid Sysyem</title>
</head>
<body class="bg-light p-4">
    <div class="container">
        <!--Cabeçalho-->>
        <header class="mb-5 text-center">
            <h1 class="display-5 text-primary">Boostrap Grid System</h1>
            <p class="lead text-secondary">
                Redimencione a janela do navegador para ver o grid funcionando
            </p>

        </header>

        <!--Iniciando o Grid-->
        <section class="mb-5">
            <h2 class="h4 mb-3">tres colunas iguais</h2>
            <div class="row g-3">
                <div class="col">
                    <div class="demo-box">coluna 1</div>
                </div>
                <div class="col">
                    <div class="demo-box">coluna 2</div>
                </div>
                <div class="col">
                    <div class="demo-box">coluna 3</div>
                </div>
            </div>
        </section>
    </div>
    <!--carregamento do vite com o boostrap e o style.css-->>
    <script type="module" src="src/main.js"></script>
</body>
</html>
